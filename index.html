<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наталья Ивахненко</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold1: #F5F5F5;
            --gold2: #C0C0C0;
            --gold3: #A8A8A8;
            --gold4: #707070;
            --bg: #0a0a0a;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: Georgia, 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient glow blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.13;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 {
            width: 500px; height: 500px;
            background: var(--gold4);
            top: -150px; left: -150px;
            animation: drift1 12s ease-in-out infinite alternate;
        }
        .blob-2 {
            width: 400px; height: 400px;
            background: var(--gold3);
            bottom: -100px; right: -100px;
            animation: drift2 10s ease-in-out infinite alternate;
        }
        .blob-3 {
            width: 300px; height: 300px;
            background: var(--gold2);
            top: 50%; left: 60%;
            animation: drift3 14s ease-in-out infinite alternate;
        }

        @keyframes drift1 { to { transform: translate(60px, 80px); } }
        @keyframes drift2 { to { transform: translate(-50px, -70px); } }
        @keyframes drift3 { to { transform: translate(-80px, 50px); } }

        /* Card */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 220, 80, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 215, 0, 0.12);
            border-radius: 28px;
            padding: 56px 48px;
            max-width: 500px;
            width: 92%;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(255,215,0,0.06) inset,
                0 40px 80px rgba(0, 0, 0, 0.55),
                0 0 70px rgba(184, 134, 11, 0.12);
        }

        /* Avatar */
        .avatar-wrap {
            width: 130px;
            height: 130px;
            margin: 0 auto 28px;
            position: relative;
        }

        .avatar-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--gold4), var(--gold2), var(--gold1), var(--gold3), var(--gold4));
            padding: 3px;
            
        }

        @keyframes rotate-ring {
            to { transform: rotate(360deg); }
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Photo (shown when added) */
        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .avatar-inner svg {
            width: 50px;
            height: 50px;
        }

        /* Name */
        .name {
            font-size: clamp(1.9rem, 7vw, 2.8rem);
            font-weight: 700;
            font-style: italic;
            line-height: 1.18;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold1) 0%, var(--gold2) 35%, var(--gold3) 65%, var(--gold1) 100%);
            background-size: 250% 250%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: name-glow 5s ease infinite;
            filter: drop-shadow(0 0 22px rgba(255, 215, 0, 0.5));
        }

        @keyframes name-glow {
            0%   { background-position: 0% 50%;   filter: drop-shadow(0 0 18px rgba(255,215,0,0.45)); }
            50%  { background-position: 100% 50%; filter: drop-shadow(0 0 38px rgba(255,165,0,0.6)); }
            100% { background-position: 0% 50%;   filter: drop-shadow(0 0 18px rgba(255,215,0,0.45)); }
        }

        .subtitle {
            font-family: Georgia, serif;
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 215, 0, 0.38);
            margin-bottom: 30px;
        }

        /* Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border-radius: 100px;
            font-family: Georgia, serif;
            font-size: 0.77rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tag:hover { transform: translateY(-2px); }

        .tag-1 {
            background: rgba(184, 134, 11, 0.18);
            border: 1px solid rgba(184, 134, 11, 0.4);
            color: #FFE566;
            box-shadow: 0 0 12px rgba(184,134,11,0.12) inset;
        }
        .tag-2 {
            background: rgba(255, 165, 0, 0.13);
            border: 1px solid rgba(255, 165, 0, 0.35);
            color: #FFD97D;
            box-shadow: 0 0 12px rgba(255,165,0,0.10) inset;
        }
        .tag-3 {
            background: rgba(255, 215, 0, 0.10);
            border: 1px solid rgba(255, 215, 0, 0.28);
            color: #FFE566;
            box-shadow: 0 0 12px rgba(255,215,0,0.08) inset;
        }

        .tag-1:hover { box-shadow: 0 4px 20px rgba(184,134,11,0.35); }
        .tag-2:hover { box-shadow: 0 4px 20px rgba(255,165,0,0.30); }
        .tag-3:hover { box-shadow: 0 4px 20px rgba(255,215,0,0.28); }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.18), transparent);
            margin: 0 auto 28px;
        }

        /* Socials */
        .socials {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.1);
            text-decoration: none;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-link::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: inherit;
        }

        .social-link.tg::after { background: linear-gradient(135deg, #0088cc, #00c2ff); }
        .social-link.ig::after { background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .social-link.li::after { background: linear-gradient(135deg, #0077b5, #00a0dc); }
        .social-link.tw::after { background: linear-gradient(135deg, #14171a, #2d3748); }

        .social-link:hover::after { opacity: 1; }
        .social-link:hover        { transform: translateY(-7px) scale(1.12); border-color: transparent; }
        .social-link.tg:hover     { box-shadow: 0 12px 28px rgba(0,136,204,0.45); }
        .social-link.ig:hover     { box-shadow: 0 12px 28px rgba(220,39,67,0.4); }
        .social-link.li:hover     { box-shadow: 0 12px 28px rgba(0,119,181,0.45); }
        .social-link.tw:hover     { box-shadow: 0 12px 28px rgba(20,23,26,0.6); }

        .social-link svg {
            position: relative;
            z-index: 1;
            width: 22px;
            height: 22px;
            fill: rgba(255, 215, 0, 0.65);
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        .social-link:hover svg { fill: #fff; transform: scale(1.08); }

        /* CTA button */
        .cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 38px;
            background: linear-gradient(135deg, var(--gold4), var(--gold3), var(--gold2));
            background-size: 200% 200%;
            color: #1a0e00;
            font-family: Georgia, serif;
            font-weight: 700;
            font-size: 0.97rem;
            letter-spacing: 0.5px;
            text-decoration: none;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
            animation: pulse-btn 2.8s ease-in-out infinite;
            position: relative;
        }

        .cta:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 0 55px rgba(255,215,0,0.55), 0 12px 30px rgba(0,0,0,0.35);
            animation: none;
        }

        .cta:active { transform: scale(0.97); }

        @keyframes pulse-btn {
            0%, 100% { box-shadow: 0 0 18px rgba(255,165,0,0.45), 0 4px 20px rgba(0,0,0,0.3); }
            50%       { box-shadow: 0 0 38px rgba(255,215,0,0.6), 0 4px 20px rgba(0,0,0,0.3); }
        }

        .cta svg {
            width: 20px;
            height: 20px;
            fill: #1a0e00;
            flex-shrink: 0;
        }

        @media (max-width: 420px) {
            .card { padding: 42px 22px; }
            .socials { gap: 12px; }
            .social-link { width: 46px; height: 46px; border-radius: 12px; }
        }
    </style>
</head>

<script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const STAR_COUNT = 110;
    const stars = [];

    class Star {
        constructor() { this.init(true); }
        init(random) {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.4 + 0.3;
            this.vx = (Math.random() - 0.5) * 0.18;
            this.vy = (Math.random() - 0.5) * 0.18;
            this.alpha = Math.random() * 0.55 + 0.1;
            this.alphaDir = (Math.random() - 0.5) * 0.004;
            // golden hue range (40–55)
            this.hue = 40 + Math.random() * 15;
            this.sat = 80 + Math.random() * 20;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha += this.alphaDir;
            if (this.alpha > 0.65) { this.alpha = 0.65; this.alphaDir *= -1; }
            if (this.alpha < 0.05) { this.alpha = 0.05; this.alphaDir *= -1; }
            if (this.x < -5 || this.x > canvas.width + 5 || this.y < -5 || this.y > canvas.height + 5) {
                this.init(true);
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, 72%, ${this.alpha})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());

    function drawConnections() {
        const DIST = 90;
        for (let i = 0; i < stars.length; i++) {
            for (let j = i + 1; j < stars.length; j++) {
                const dx = stars[i].x - stars[j].x;
                const dy = stars[i].y - stars[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < DIST) {
                    ctx.beginPath();
                    ctx.moveTo(stars[i].x, stars[i].y);
                    ctx.lineTo(stars[j].x, stars[j].y);
                    const alpha = (1 - dist / DIST) * 0.07;
                    ctx.strokeStyle = `rgba(220, 170, 0, ${alpha})`;
                    ctx.lineWidth = 0.6;
                    ctx.stroke();
                }
            }
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawConnections();
        stars.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(loop);
    }
    loop();
</script>
