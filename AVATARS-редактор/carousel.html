<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Карусели — MWR Life</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E27;
    --indigo: #6366F1;
    --cyan: #06B6D4;
    --green: #10B981;
    --gold: #F59E0B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    font-family: 'Space Mono', monospace;
    color: white;
    min-height: 100vh;
  }

  /* ── CONTROL PANEL ── */
  .panel {
    background: #1a1a2e;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .panel-title {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--cyan);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .tab-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .tab-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 0.2rem;
    background: transparent;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--indigo);
    border-color: var(--indigo);
    color: white;
  }
  .tab-btn:hover:not(.active) {
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .hint {
    margin-left: auto;
    font-size: 0.55rem;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }

  /* ── GRID OF SLIDES ── */
  .slides-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .slide-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .slide-num {
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    padding-left: 0.2rem;
  }
  .slide {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 0.5rem;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .slide:hover {
    transform: scale(1.02);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .fullscreen-btn {
    display: block;
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 0.2rem;
    padding: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .fullscreen-btn:hover {
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(6,182,212,0.05);
  }

  /* ── FULLSCREEN OVERLAY ── */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1.5rem;
  }
  #overlay.show { display: flex; }
  #overlay-slide {
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    border-radius: 0.5rem;
    overflow: hidden;
  }
  .overlay-controls {
    display: flex;
    gap: 1rem;
    align-items: center;
  }
  .ov-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.6rem 1.5rem;
    border-radius: 0.2rem;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
  }
  .ov-prev, .ov-next {
    background: rgba(255,255,255,0.08);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .ov-prev:hover, .ov-next:hover { background: rgba(255,255,255,0.15); }
  .ov-close {
    background: rgba(239,68,68,0.2);
    color: #ef4444;
    border: 1px solid rgba(239,68,68,0.3);
  }
  .ov-close:hover { background: rgba(239,68,68,0.3); }
  .ov-counter {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
  }
  .ov-hint {
    font-size: 0.5rem;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
  }

  /* ══════════════════════════════════
     SLIDE INNER STYLES
  ══════════════════════════════════ */

  /* === ОБЩИЕ === */
  .s { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .s-bg-dark { background: #0A0E27; }
  .s-bg-darker { background: #070a1c; }
  .s-bg-indigo { background: linear-gradient(135deg, #1e1b4b, #0A0E27); }
  .s-bg-cyan { background: linear-gradient(135deg, #0c2a33, #0A0E27); }
  .s-bg-gold { background: linear-gradient(135deg, #2a1f0a, #0A0E27); }
  .s-bg-green { background: linear-gradient(135deg, #0a1f16, #0A0E27); }

  /* декоративные элементы */
  .s-deco-circle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .s-line-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .s-line-top.indigo { background: linear-gradient(90deg, transparent, var(--indigo), transparent); }
  .s-line-top.cyan { background: linear-gradient(90deg, transparent, var(--cyan), transparent); }
  .s-line-top.gold { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .s-line-top.green { background: linear-gradient(90deg, transparent, var(--green), transparent); }

  .s-num {
    position: absolute;
    top: 1.2em;
    right: 1.2em;
    font-size: 0.5em;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.2);
  }
  .s-brand {
    position: absolute;
    bottom: 1em;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.45em;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }
  .s-tag {
    display: inline-block;
    font-size: 0.5em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.4em 1em;
    border-radius: 2em;
    margin-bottom: 1em;
  }
  .s-tag.cyan { color: var(--cyan); border: 1px solid rgba(6,182,212,0.3); }
  .s-tag.gold { color: var(--gold); border: 1px solid rgba(245,158,11,0.3); }
  .s-tag.green { color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
  .s-tag.indigo { color: var(--indigo); border: 1px solid rgba(99,102,241,0.3); }

  /* текст */
  .s-eyebrow {
    font-size: 0.5em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 0.8em;
  }
  .s-h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    line-height: 1.1;
    margin-bottom: 0.4em;
  }
  .s-h1.xl { font-size: 2em; }
  .s-h1.lg { font-size: 1.6em; }
  .s-h1.md { font-size: 1.3em; }
  .s-body {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    line-height: 1.5;
    color: rgba(255,255,255,0.7);
  }
  .s-body.lg { font-size: 0.9em; }
  .s-body.md { font-size: 0.75em; }
  .s-accent { color: var(--cyan); }
  .s-accent-gold { color: var(--gold); }
  .s-accent-green { color: var(--green); }
  .s-accent-indigo { color: var(--indigo); }

  .s-cta {
    display: inline-block;
    font-size: 0.5em;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.8em 2em;
    border-radius: 0.2em;
    font-weight: 700;
    margin-top: 0.5em;
  }
  .s-cta.cyan { background: linear-gradient(135deg, var(--cyan), var(--indigo)); color: white; }
  .s-cta.gold { background: linear-gradient(135deg, var(--gold), #d97706); color: #0A0E27; }

  .s-big-num {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 4em;
    line-height: 1;
    color: white;
  }
  .s-divider {
    width: 3em;
    height: 1px;
    background: var(--cyan);
    margin: 0.8em 0;
  }
  .s-list { list-style: none; }
  .s-list li {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75em;
    color: rgba(255,255,255,0.8);
    padding: 0.4em 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 0.6em;
  }
  .s-list li::before { content: '→'; color: var(--cyan); font-family: monospace; font-size: 0.8em; }

  .s-emoji { font-size: 2em; margin-bottom: 0.3em; display: block; }

  .s-vs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0.5em;
    align-items: center;
    font-size: 0.7em;
    width: 100%;
  }
  .s-vs-col { display: flex; flex-direction: column; gap: 0.3em; }
  .s-vs-sep { font-family: 'Space Mono', monospace; color: rgba(255,255,255,0.2); font-size: 0.8em; text-align: center; }

  .s-box {
    border-radius: 0.4em;
    padding: 0.8em 1em;
  }
  .s-box.bad { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); }
  .s-box.good { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); }
  .s-box-label { font-size: 0.55em; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 0.3em; }
  .s-box-val { font-family: 'Cormorant Garamond', serif; font-size: 1.2em; font-weight: 600; }
  .s-box.bad .s-box-val { color: #ef4444; }
  .s-box.good .s-box-val { color: var(--green); }

  .s-arrow { font-family: 'Cormorant Garamond', serif; font-size: 1.5em; color: rgba(255,255,255,0.3); text-align:center; }

  /* padding helper */
  .sp { padding: 8% 8% 12%; }
  .sp-center { padding: 8%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* carousel nav dots */
  .s-dots {
    position: absolute;
    bottom: 1.8em;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 0.3em;
  }
  .s-dot {
    width: 0.35em;
    height: 0.35em;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }
  .s-dot.active { background: var(--cyan); width: 0.8em; border-radius: 0.2em; }

  /* === КАРУСЕЛЬ 6: ПУТЕШЕСТВИЯ — СВЕТЛАЯ ТЕМА === */
  .s-bg-dawn    { background: linear-gradient(155deg, #FEF0E8 0%, #FAD8B8 40%, #E0EFF8 100%); }
  .s-bg-sand    { background: linear-gradient(145deg, #FFF8F0, #FDE8CC, #FFF3E8); }
  .s-bg-sea     { background: linear-gradient(145deg, #E0F7F4, #B8EAE4, #D0F3EE); }
  .s-bg-sky     { background: linear-gradient(155deg, #E8F5FE, #C4DFF5, #D8EEFB); }
  .s-bg-palm    { background: linear-gradient(145deg, #EEF8EE, #CCE9CC, #E4F4E4); }
  .s-bg-sunset  { background: linear-gradient(155deg, #FFF0E0, #FFCF99, #FFE4C0); }

  .st { color: #1A3A30; }
  .st-muted { color: #5A7A70; font-size: 0.55em; line-height: 1.6; }
  .st-tag {
    display: inline-block;
    font-size: 0.42em;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0.4em 1em;
    border-radius: 2em;
    margin-bottom: 0.8em;
    border: 1px solid;
  }
  .st-tag.teal  { color: #1A8C80; border-color: rgba(26,140,128,0.3); background: rgba(26,140,128,0.08); }
  .st-tag.warm  { color: #B06020; border-color: rgba(176,96,32,0.3); background: rgba(176,96,32,0.08); }
  .st-tag.sky   { color: #1A6A9A; border-color: rgba(26,106,154,0.3); background: rgba(26,106,154,0.08); }
  .st-tag.green { color: #2A7A40; border-color: rgba(42,122,64,0.3); background: rgba(42,122,64,0.08); }
  .st-h1 {
    font-family: 'Cormorant Garamond', serif;
    color: #1A3A30;
    line-height: 1.1;
    margin-bottom: 0.3em;
  }
  .st-h1.xl { font-size: 1.8em; }
  .st-h1.lg { font-size: 1.5em; }
  .st-h1.md { font-size: 1.2em; }
  .st-h1 em { font-style: italic; color: #1A8C80; }
  .st-h1 .warm { color: #B06020; }
  .st-divider { width: 2.5em; height: 2px; margin: 0.5em 0; border-radius: 1px; }
  .st-divider.teal   { background: #1A8C80; }
  .st-divider.warm   { background: #B06020; }
  .st-divider.sky    { background: #1A6A9A; }
  .st-list { list-style: none; display: flex; flex-direction: column; gap: 0.5em; }
  .st-list li {
    font-size: 0.52em;
    color: #3A5A50;
    padding-left: 1.2em;
    position: relative;
    line-height: 1.5;
  }
  .st-list li::before { content: '—'; position: absolute; left: 0; color: #1A8C80; }
  .st-stat {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2em;
    font-weight: 600;
    line-height: 1;
    margin: 0.2em 0;
  }
  .st-stat.teal { color: #1A8C80; }
  .st-stat.warm { color: #B06020; }
  .st-cta {
    display: inline-block;
    font-size: 0.45em;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.7em 2em;
    border-radius: 0.3em;
    margin-top: 0.8em;
    color: white;
    background: #1A8C80;
  }
  .st-brand {
    position: absolute;
    bottom: 1em;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.4em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(26,58,48,0.3);
  }
  .st-wave {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    opacity: 0.12;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-title">MWR Карусели</div>
  <div class="tab-btns">
    <button class="tab-btn active" onclick="showCarousel(0)">1 · Боль → Решение</button>
    <button class="tab-btn" onclick="showCarousel(1)">2 · 120 USDT</button>
    <button class="tab-btn" onclick="showCarousel(2)">3 · Безоплатка</button>
    <button class="tab-btn" onclick="showCarousel(3)">4 · Мой путь</button>
    <button class="tab-btn" style="border-color:rgba(245,158,11,0.4);color:#F59E0B;" onclick="showCarousel(4)">⭐ Год → Путешествие</button>
    <button class="tab-btn" style="border-color:rgba(26,140,128,0.5);color:#1A8C80;" onclick="showCarousel(5)">✈ Боль → Решение</button>
  </div>
  <div class="hint">Нажми на слайд → полный экран → скриншот</div>
</div>

<div class="slides-grid" id="grid"></div>

<!-- FULLSCREEN OVERLAY -->
<div id="overlay">
  <div id="overlay-slide"></div>
  <div class="overlay-controls">
    <button class="ov-btn ov-prev" onclick="ovNav(-1)">← Назад</button>
    <span class="ov-counter" id="ov-counter"></span>
    <button class="ov-btn ov-next" onclick="ovNav(1)">Вперёд →</button>
    <button class="ov-btn ov-close" onclick="closeOverlay()">✕ Закрыть</button>
  </div>
  <div class="ov-hint">Нажми PrintScreen или сделай скриншот для сохранения</div>
</div>

<script>
// ══════════════════════════════════════════════════════
// ДАННЫЕ КАРУСЕЛЕЙ
// ══════════════════════════════════════════════════════

const carousels = [

// ── КАРУСЕЛЬ 1: БОЛЬ → РЕШЕНИЕ ──
[
  // слайд 1 — заголовок
  `<div class="s s-bg-darker sp-center">

  // слайд 2
  `<div class="s s-bg-dark sp">

  // слайд 3
  `<div class="s s-bg-cyan sp-center">
    <div class="s-line-top cyan"></div>
    <div class="s-num">03/06</div>
    <div class="s-emoji">💡</div>
    <div class="s-eyebrow" style="color:var(--cyan);">Потом я узнала</div>

    <div class="s-brand">@Natali_Ivahnenko · MWR Life</div>
  </div>`,

  // слайд 4 — сравнение
  `<div class="s s-bg-dark sp">
    <div class="s-line-top green"></div>
    <div class="s-num">04/06</div>
    <div class="s-eyebrow" style="color:var(--green);">Тот же отель. Та же дата.</div>
    <div class="s-vs" style="margin:1em 0;">
      <div class="s-vs-col">
        <div class="s-box bad">
          <div class="s-box-label">Booking</div>
          <div class="s-box-val">€320</div>
        </div>
      </div>
      <div class="s-arrow">→</div>
      <div class="s-vs-col">
        <div class="s-box good">
          <div class="s-box-label">MWR Life</div>
          <div class="s-box-val">€160</div>
        </div>
      </div>
    </div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:0.8em;color:rgba(255,255,255,0.6);text-align:center;margin-top:0.5em;">Экономия <span style="color:var(--green);font-weight:600;">€160</span> с одного отеля</div>
    <div class="s-brand">@Natali_Ivahnenko · MWR Life</div>
  </div>`,

  // слайд 5
  `<div class="s s-bg-indigo sp-center">
    <div class="s-line-top indigo"></div>
    <div class="s-num">05/06</div>

function showCarousel(idx) {
  currentCarousel = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  carousels[idx].forEach((html, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'slide-wrap';
    const num = document.createElement('div');
    num.className = 'slide-num';
    num.textContent = `Слайд ${i + 1} из ${carousels[idx].length}`;
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = html;
    applyPhoto(slide, idx);
    slide.onclick = () => openOverlay(i);
    const btn = document.createElement('button');
    btn.className = 'fullscreen-btn';
    btn.textContent = '⛶ Открыть на весь экран';
    btn.onclick = () => openOverlay(i);
    wrap.append(num, slide, btn);
    grid.appendChild(wrap);
  });
}

function openOverlay(idx) {
  overlayIndex = idx;
  renderOverlay();
  document.getElementById('overlay').classList.add('show');
}

function renderOverlay() {
  const slides = carousels[currentCarousel];
  const ov = document.getElementById('overlay-slide');
  ov.innerHTML = slides[overlayIndex];
  applyPhoto(ov, currentCarousel);
  document.getElementById('ov-counter').textContent = `${overlayIndex + 1} / ${slides.length}`;
}

function ovNav(dir) {
  const len = carousels[currentCarousel].length;
  overlayIndex = (overlayIndex + dir + len) % len;
  renderOverlay();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('overlay').classList.contains('show')) return;
  if (e.key === 'ArrowRight') ovNav(1);
  if (e.key === 'ArrowLeft') ovNav(-1);
  if (e.key === 'Escape') closeOverlay();
});

showCarousel(0);
</script>
</body>
</html>
