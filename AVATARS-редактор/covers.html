  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    font-family: 'Inter', sans-serif;
    padding: 2rem;
  }

  .panel {
    background: #222;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 50;
    margin: -2rem -2rem 2rem;
  }
  .panel-title {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #F59E0B;
    white-space: nowrap;
  }
  .tab-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .tab-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 0.2rem;
    background: transparent;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active { background: #F59E0B; border-color: #F59E0B; color: #1a1a1a; }
  .tab-btn:hover:not(.active) { border-color: #F59E0B; color: #F59E0B; }
  .hint { margin-left: auto; font-size: 0.55rem; letter-spacing: 0.08em; color: rgba(255,255,255,0.25); text-transform: uppercase; }

  /* сетка обложек */
  .covers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  .cover-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .cover-label {
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
  }

  /* сама обложка — пропорция 9:16 */
  .cover {
    width: 100%;
    aspect-ratio: 9/16;
    border-radius: 0.5rem;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.2s;
    border: 1px solid rgba(255,255,255,0.06);
    container-type: inline-size;
  }
  .cover:hover { transform: scale(1.02); }

  .fullscreen-btn {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 0.2rem;
    padding: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .fullscreen-btn:hover { color: #F59E0B; border-color: #F59E0B; }

  /* OVERLAY */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1.5rem;
  }
  #overlay.show { display: flex; }
  #overlay-cover {
    height: min(88vh, 88vw * 9/16);
    width: auto;
    aspect-ratio: 9/16;
    border-radius: 0.5rem;
    overflow: hidden;
  }
  .ov-controls { display: flex; gap: 1rem; align-items: center; }
  .ov-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.6rem 1.5rem;
    border-radius: 0.2rem;
    cursor: pointer;
    border: none;

  .ov-nav:hover { background: rgba(255,255,255,0.15); }
  .ov-close { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  .ov-counter { font-size: 0.6rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); text-transform: uppercase; }
  .ov-hint { font-size: 0.5rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.15); text-transform: uppercase; }

    position: absolute;

  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  sets[idx].forEach((html, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'cover-wrap';
    const lbl = document.createElement('div');
    lbl.className = 'cover-label';
    lbl.textContent = `Обложка ${i + 1}`;
    const cover = document.createElement('div');
    cover.className = 'cover';
    cover.innerHTML = html;
    cover.onclick = () => openOverlay(i);
    const btn = document.createElement('button');
    btn.className = 'fullscreen-btn';
    btn.textContent = '⛶ Полный экран';
    btn.onclick = () => openOverlay(i);
    wrap.append(lbl, cover, btn);
    grid.appendChild(wrap);
  });
}

function openOverlay(idx) {
  overlayIdx = idx;
  renderOverlay();
  document.getElementById('overlay').classList.add('show');
}

function renderOverlay() {
  const covers = sets[currentSet];
  document.getElementById('overlay-cover').innerHTML = covers[overlayIdx];
  document.getElementById('ov-counter').textContent = `${overlayIdx + 1} / ${covers.length}`;
}

function ovNav(dir) {
  const len = sets[currentSet].length;
  overlayIdx = (overlayIdx + dir + len) % len;
  renderOverlay();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('overlay').classList.contains('show')) return;
  if (e.key === 'ArrowRight') ovNav(1);
  if (e.key === 'ArrowLeft') ovNav(-1);
  if (e.key === 'Escape') closeOverlay();
});

showSet(0);
</script>
</body>
</html>
